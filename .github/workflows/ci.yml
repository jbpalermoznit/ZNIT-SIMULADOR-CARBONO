name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancela runs antigos do mesmo branch quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      # Informativo — o repo ainda tem lint pendente; não bloqueia o merge.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Bloqueantes: tipos e testes precisam passar.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
