services:
  - type: web
    name: znit-carbon-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./znit_carbon.db
      - key: JWT_SECRET
        fromGroup: znit-secrets
      - key: FRONTEND_URL
        value: https://znit-carbon.vercel.app
      - key: SUPABASE_URL
        value: https://xyuqhpgjbrattreuvfzy.supabase.co
      - key: SUPABASE_ANON_KEY
        fromGroup: znit-secrets
      - key: SUPABASE_SCHEMA
        value: backend
      - key: N8N_WEBHOOK_URL
        value: https://orchestration.znit.ai/webhook/ocr-gemini
      - key: POWERBI_API_KEY
        fromGroup: znit-secrets
